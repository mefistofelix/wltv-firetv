name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build (no tests)
        run: gradle --no-daemon assembleRelease -x test

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WLTV-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WLTV-apk
          path: WLTV-${{ github.run_number }}.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "WLTV-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --title "WLTV build ${{ github.run_number }}" \
            --notes "Build automatica di ${{ github.sha }}: $(git log -1 --pretty=%s)" --latest
      # the update is offered to the installed apps from the dev PC (scripts/release.sh), as in FireBro:
      # no token for mefistofelix/firetv-apps is stored in this public repository
