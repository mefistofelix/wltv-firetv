name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build (no tests)
        run: gradle --no-daemon assembleRelease -x test

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WLTV-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WLTV-apk
          path: WLTV-${{ github.run_number }}.apk

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "WLTV-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --title "WLTV build ${{ github.run_number }}" \
            --notes "Build automatica di ${{ github.sha }}: $(git log -1 --pretty=%s)" --latest

      # self-update (Updater.kt): offer the build to the installed apps through mefistofelix/firetv-apps.
      # Needs the secret FIRETV_APPS_TOKEN (fine-grained token with Contents read/write on firetv-apps only);
      # without it the step is skipped and scripts/publish-update.sh is run by hand.
      - name: Offer the update (firetv-apps)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.FIRETV_APPS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "FIRETV_APPS_TOKEN not set: update not offered"; exit 0; fi
          bash scripts/publish-update.sh "${{ github.run_number }}" "WLTV-${{ github.run_number }}.apk"
